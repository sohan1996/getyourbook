<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - OldBookHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="contact-section">

        <div class="contact-container">

            <h1>Contact Us</h1>

            <p class="subtitle">
                Got a question? We'd love to hear from you.
                Send us a message<br class="desktop-break">
                and we'll respond as soon as possible.
            </p>


            <form id="contactForm">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">Name*</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">Email address *</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <!-- Message -->
                <div class="form-group">

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="7"
                    ></textarea>

                </div>


                <!-- Submit -->
                <button type="submit" class="send-btn">
                    Send Message
                </button>

                <!-- Message shown by JavaScript -->
                <p id="formMessage"></p>

            </form>

        </div>

    </section>


    <script src="contract.js"></script>

</body>

</html>
